<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spain travel guides | AponGo</title><meta name="description" content="Choose a destination and find places to visit and transport guides.">
<link rel="canonical" href="https://apongo-web.vercel.app/guias/index-en.html">
<link rel="alternate" hreflang="en" href="https://apongo-web.vercel.app/guias/index-en.html"><link rel="alternate" hreflang="es" href="https://apongo-web.vercel.app/guias/index.html">
<style>*{box-sizing:border-box}body{margin:0;background:#f2f9fb;color:#173345;font:1rem/1.55 system-ui,sans-serif}.wrap{width:min(44rem,calc(100% - 2rem));margin:auto}header{background:#082f45;color:white;padding:1.2rem 0;border-bottom:4px solid #ff7043}header a{color:white}.brand{font-size:1.4rem;font-weight:900;text-decoration:none}.brand span{color:#ff986e}h1{line-height:1.14;margin:.65rem 0}main{padding:1.25rem 0 3rem}nav{display:flex;gap:.85rem;flex-wrap:wrap}a{color:#075578}label{display:block;font-weight:700}input{width:100%;padding:.75rem;font:inherit;border:1px solid #647f8c;border-radius:.55rem;margin:.35rem 0 .8rem}ul,ol{list-style:none;padding:0;margin:0}li>a{display:block;min-height:44px;padding:.75rem 1rem;border-bottom:1px solid #c4dce2;background:white;font-weight:650}li>a:hover{background:#e1f5f4}:focus-visible{outline:3px solid #ad430e;outline-offset:2px}[hidden]{display:none!important}</style></head><body>
<header><div class="wrap"><a class="brand" href="/">Apon<span>Go</span></a><h1>Spain travel guides</h1>
<nav aria-label="Navigation"><a href="index.html" hreflang="es" lang="es">Español</a></nav></div></header>
<main class="wrap"><form id="search" role="search" hidden><label for="destination">Find a destination</label><input type="search" id="destination" placeholder="Alicante, Barcelona…"></form>
<p id="empty" role="status" hidden>No destinations found.</p>
<ul id="destinations"><li data-name="Alicante "><a href="alicante-en.html">Alicante</a></li>
<li data-name="Barcelona "><a href="barcelona-en.html">Barcelona</a></li>
<li data-name="Madrid"><a href="madrid-en.html">Madrid</a></li>
<li data-name="Benidorm "><a href="benidorm-en.html">Benidorm</a></li></ul>
<script>
const form = document.querySelector('#search');
const field = document.querySelector('#destination');
const places = [...document.querySelectorAll('#destinations li')];
const empty = document.querySelector('#empty');
const normalize = value => value.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().trim();
form.hidden = false;
form.addEventListener('submit', event => event.preventDefault());
field.addEventListener('input', () => {
    const query = normalize(field.value);
    for (const place of places) place.hidden = !normalize(place.dataset.name).includes(query);
    empty.hidden = places.some(place => !place.hidden);
});
</script></main></body></html>
